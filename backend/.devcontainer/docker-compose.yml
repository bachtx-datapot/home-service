services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ../..:/app:cached
    command: sleep infinity
    network_mode: service:db

  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
